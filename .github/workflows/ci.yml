name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build -j

      # 覆盖 test_math / test_mahony / test_estimator / replay_nav2（含 NAV2 数据集 RMSE 验收）
      - name: Test
        run: ctest --test-dir build --output-on-failure
